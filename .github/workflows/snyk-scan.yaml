name: Snyk Security Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  snyk:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: datum-cloud/actions/.github/workflows/snyk-scan.yaml@2dbca23d057e20ff1aab144b94a06d09ea75e5f6 # v1.21.0
    with:
      severity-threshold: high
      upload-sarif: true
    secrets: inherit
