apiVersion: apps/v1
kind: Deployment
metadata:
  name: backstage
  namespace: backstage
spec:
  template:
    spec:
      containers:
        - name: backstage
          args:
            - "node"
            - "packages/backend"
            - "--config"
            - "app-config.yaml"
            - "--config"
            - "/etc/backstage/app-config.e2e.yaml"
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: backstage-postgres
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backstage-postgres
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: app-config-e2e
              mountPath: /etc/backstage
              readOnly: true
      volumes:
        - name: app-config-e2e
          configMap:
            name: backstage-app-config-e2e
