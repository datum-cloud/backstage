apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: backstage

resources:
  - ../base
  - postgres-secret.yaml
  - postgres-deployment.yaml
  - postgres-service.yaml
  - app-config-e2e.yaml

images:
  - name: ghcr.io/datum-cloud/backstage
    newName: backstage
    newTag: e2e

patches:
  - path: deployment-patch.yaml
    target:
      kind: Deployment
      name: backstage
